<!DOCTYPE html>
<html lang="en">
<head>
    <title>Registration</title>
    <link rel="stylesheet" href="Design.css">
</head>
<body>

    <header class="header">
        <h1>My Personal Website</h1>
        <p>Welcome to my Personal Website</p>
    </header>

    <nav class="navigation">
        <a id="navv" href="Home.html">Home</a>
        <a id="navv" href="Registration.html">Registration</a>
        <a id="navv" href="Grades.html">Grades</a>
        <a id="navv" href="Profile.html">Profile</a>
    </nav>


    <div class="body">
        <form class="form">
            
            <h3>Student Registration Form</h3>
            
            <br>
            Student Name:
            <br>
            <input type="name" name="name"/>
            <br>

            <br>
            Email:
            <br>
            <input type="name" name="name"/>
            <br>

            <br>
            Password:
            <br>
            <input type="password" name="passwaord"/>
            <br>

            <br>
            Gender
            <br>
            <input type="radio" name="gender" value="Male">Male
            <input type="radio" name="gender" value="Female">Female
            <br>

            <br>
            Course
            <br>
            <select name="dropdown">
                <option value="IT">IT</option>
                <option value="CS">CS</option>
                <option value="OA">OA</option>
                <option value="EDU">EDU</option>
                <option value="HM">HM</option>
            </select>
            <br>

            <br>
            Skills
            <input type="checkbox" name="HTML" id="">HTML
            <input type="checkbox" name="CSS" id="">CSS
            <input type="checkbox" name="DEV" id="">DEV
            <br>

            <br>
            Profile Picture
            <input type="file" name="Choose file" accept="Image"/>
            <br>

            <br>
            Address
            <br>
            <textarea cols="50" rows="5" name="Address" placeholder="address here" ></textarea>
            <br>

            <input type="submit" name="submit" value="submit" class="sub"/>
            <input type="submit" name="submit" value="submit" class="sub"/>
        </form>
    </div>

    

    <footer class="footer">

</body>
