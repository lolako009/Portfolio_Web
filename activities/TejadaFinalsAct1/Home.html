<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"content="width=device-width, initial-scale=1.0">
    <title>My Student Card</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="card">
    <img id="Image1" src="images/student.jpg" alt="student">
    <h1 id="Name1"> Ken </h1>
    <p id="Course1">BS Information Technology</p>

    <input type="text" id="Input1" placeholder="Type your nickname">

    <select id="Year1">
        <option value="">Select Year</option>
        <option>1st Year</option>
        <option>2nd Year</option>
        <option>3rd Year</option>
        <option>4th Year</option>
    </select>

    <div class="buttons">

        <button id="Click1">Click</button>
        <button id="DblClick1">2x Click</button>
        <button id="Press1">Hold</button>
        <button id="Reset1">Reset</button>

    </div>

    <p id="Status1">Waiting for you...</p>

</div>

<script src="Code.js"></script>

</body>
</html>
